name: 기록 형식 검사

on:
  push:
    branches: [main]
    paths:
      - 'week-*/**'
      - 'README.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python scripts/validate.py
