name: 주차 준비

on:
  schedule:
    # 일요일 08:00 KST (= 토요일 23:00 UTC)
    - cron: '0 23 * * 6'
  workflow_dispatch:
    inputs:
      week:
        description: 주차 번호 (비우면 오늘 기준으로 계산)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-scaffold
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 아래 rebase가 얕은 클론에서 막히지 않도록 전체 이력을 받는다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 주차 폴더와 README 일정 만들기
        id: scaffold
        env:
          WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$WEEK" ]; then
            python scripts/scaffold_week.py --week "$WEEK"
          else
            python scripts/scaffold_week.py
          fi

      - name: 커밋해서 올리기
        if: steps.scaffold.outputs.changed == 'true'
        env:
          WEEK: ${{ steps.scaffold.outputs.week }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${WEEK}주차 준비"

          # 워크플로가 도는 사이 페이지에서 저장한 커밋이 있으면 그 위에 얹는다.
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"
