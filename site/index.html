<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>weekly study</title>
<meta name="description" content="매주 각자의 목표를 적고 달성 여부를 남기는 기록.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0a0a'/%3E%3Crect x='3.5' y='7' width='3' height='3' rx='.6' fill='%23fff'/%3E%3Crect x='9.5' y='7' width='3' height='3' rx='.6' fill='%23fff'/%3E%3C/svg%3E">
<!-- 첫 페인트 전에 테마를 정해 깜빡임을 막는다. 저장값이 없으면 다크. -->
<script>document.documentElement.dataset.theme = localStorage.getItem('ws.theme') === 'light' ? 'light' : 'dark';</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>weekly study</h1>
      <p>각자의 목표 · 각자의 기록</p>
    </div>
    <div class="topbar-actions">
      <button type="button" id="theme-toggle" class="btn btn-quiet btn-icon" aria-label="밝은 테마로 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <button type="button" id="settings-open" class="btn btn-quiet">설정</button>
    </div>
  </div>
</header>

<div class="layout">

  <nav class="weeks" aria-label="주차 목록">
    <div class="weeks-head">
      <span class="eyebrow">WEEKS</span>
      <label class="sr-only" for="week-jump">주차 선택</label>
      <select id="week-jump"></select>
    </div>
    <ol id="week-list" class="week-list"></ol>
  </nav>

  <main id="detail" class="detail">
    <p class="loading">불러오는 중…</p>
  </main>

</div>

<dialog id="settings" class="sheet">
  <div class="sheet-body">
    <h2>설정</h2>

    <fieldset class="field">
      <legend>참여자</legend>
      <div id="who-options" class="who"></div>
      <p class="error" id="who-error" hidden>참여자를 선택해주세요.</p>
    </fieldset>

    <div class="field">
      <label for="token">GitHub 토큰</label>
      <input type="password" id="token" autocomplete="off" spellcheck="false"
             placeholder="github_pat_...">
      <p class="hint">
        이 브라우저에만 저장되고 GitHub로만 전송됩니다. 저장소 하나에만 권한을 준
        fine-grained 토큰을 쓰세요. 필요한 권한은 Contents 읽기/쓰기입니다.
      </p>
    </div>

    <div class="sheet-actions">
      <button type="button" id="token-clear" class="btn btn-quiet">토큰 삭제</button>
      <button type="button" id="settings-save" class="btn btn-solid">저장</button>
    </div>
  </div>
</dialog>

<dialog id="editor" class="sheet">
  <div class="sheet-body">
    <h2 id="editor-title">목표 작성</h2>
    <p class="hint" id="editor-hint"></p>
    <button type="button" id="editor-prefill" class="btn btn-sm prefill" hidden></button>
    <label class="sr-only" for="editor-text">내용</label>
    <!-- autofocus가 없으면 시트가 열릴 때 첫 버튼이 포커스를 가져간다. -->
    <textarea id="editor-text" rows="8" spellcheck="false" autofocus></textarea>
    <div class="sheet-actions">
      <button type="button" id="editor-cancel" class="btn btn-quiet">취소</button>
      <button type="button" id="editor-save" class="btn btn-solid">저장</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
